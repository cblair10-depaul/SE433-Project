model:
  model_name: "deepseek/deepseek-flash"
  model_kwargs:
    api_base: "https://api.deepseek.com"
    drop_params: true
  litellm_model_registry: "registry.json"
  cost_tracking: "ignore_errors"

agent:
  step_limit: 100
  system_template: |
    You are a helpful assistant that can interact with a computer.
  instance_template: |
    Please generate test cases that reproduce the bug described in the issue below. Do NOT fix the issue.
    
    You can execute bash commands and edit files to create test files. Your current working directory is the root of
    the repository, checked out at the commit that contains the bug.
    
    ## Issue
    {{task}}
    
    ## Instructions
    1. Analyze the codebase by finding and reading relevant files
    2. Create a script to reproduce the issue
    3. A control flow graph of every function and method in the repository's non-test code has already been built with `python-graphs` and is stored in `/cfg`. Do not install or run python-graphs yourself. Find the dotted name of the entry-point function or method your script from step 2 calls with `python /cfg/query.py find <name>` (e.g. `python /cfg/query.py find separability_matrix`).
    4. List the execution paths through that function with `python /cfg/query.py paths <dotted.name>`. Each path lists the branch decisions it takes (`line: condition  [True]` or `[False]`, and `[caught]` / `[not caught]` for except clauses) and how it ends (RETURN or RAISE, with the statement that ends it). If the paths output is too long or stops early, use `python /cfg/query.py cfg <dotted.name>` instead, which shows the function's basic blocks (`line: code`) and where each block exits to. Read the entry point's source to find the functions and methods it calls on the way to the behavior described in the issue, and list their paths the same way. From this output, make a list of every function and method executed by the script from step 2 and, for each one, the paths and branch conditions the issue's scenario goes through. The graphs are approximate (each loop is shown as skipped or entered once, `and`/`or` are not split into separate branches, and exceptions raised inside called functions are not shown), so confirm each branch by reading its source.
    5. Perform input partitions, boundary values, important input combinations, and expected outputs on the list of functions, methods, paths, and branch conditions found at the end of step 4. Each path is a candidate input partition, and each branch condition marks a candidate boundary value. See the Behavioral Specification section below for an example on how to create input partitions, boundary values, important input combinations, and expected outputs. Use this specification to choose candidate test conditions, then keep only the conditions where the issue text states, or clearly implies, what the correct result must be. Discard any condition whose expected result you would have to guess.
    6. Create at most 3 new tests from the conditions kept in step 5, choosing the ones closest to the exact scenario described in the issue. Every test you submit must fail on the current code AND pass once the bug is correctly fixed; a single test that would still fail after a correct fix makes your whole submission fail, so one certain test is better than several uncertain ones. Only create tests that do not duplicate conditions checked by existing tests. Each test must check the observable behavior described in the issue (return values, query results, raised exceptions, output) through the public API. Do NOT assume how the fix will be implemented:
       - do not assert on implementation details such as object identity (`is` / `assertIs` / `assertIsNot`), private attributes, or internal data structures;
       - do not assert the exact wording of an error or warning message unless the issue quotes it; assert the exception or warning type and, at most, a key value from the issue (for example a column or argument name);
       - do not assert an exact return type, a new function or argument name, or a new API unless the issue explicitly names it;
       - if the issue asks for new behavior or a new feature (rather than reporting a bug), test only the specific inputs and results the issue states.
       - make sure the new test has an explicit check (such as an assertion statement) in it.
    7. <important>This step is mandatory: you MUST run your new tests and see their output before submitting.</important> Run only the test file(s) you changed, using the repository's test runner:
       - django: `cd tests && python runtests.py --verbosity 2 --settings=test_sqlite --parallel 1 <module.path>` (e.g. `queries.tests`)
       - sympy: `bin/test -C --verbose <path/to/test_file.py>`
       - all other repositories: `python -m pytest <path/to/test_file.py> -k <test_name> -rA`
       Then review each new test:
       - Remove it if it passes.
       - If it fails, read the failure message. If the failure comes from a mistake in your test (a typo, a wrong import, a missing fixture), fix the test and run it again.
       - Make sure the new test has an explicit check (such as an assertion statement) of a value or values in it. If there are no explicit checks such as an assertion check in the test, remove the test.
       - For each remaining failing test, write one sentence explaining why it will pass once the bug is fixed, based only on the issue text. If you cannot explain this without guessing how the fix is implemented, remove the test.
       Keep the existing tests in the file passing; do not change or remove them.
    8. If no failing tests remain after step 7: repeat steps 4-6 up to 2 times until a failed test is created or the limit of 2 is reached.
    9. Do NOT modify any non-test source files and do NOT attempt to fix the issue. Only add or edit tests inside the repository's existing test suite (e.g. a `tests/` directory or `test_*.py` files next to existing tests). Delete the reproduction script from step 2 and any other scratch files before submitting. Work only from the issue text and the code in this repository: do NOT search the internet, git history, or the filesystem outside the repository for the official fix or its tests.
    10. Leave your new tests in place (do not commit or revert them). They are collected automatically with `git diff` when you submit.
    11. Do not submit until you have run your new tests in step 7 and seen them fail. Submit your final output by issuing: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`. Do not combine it with any other command. <important>After this command, you cannot continue working on this task.</important>
    
    ## Useful command examples
    ### Create a new file:
    ```bash
    cat <<'EOF' > newfile.py
    import numpy as np
    hello = "world"
    print(hello)
    EOF
    ```
    
    ### View file content:
    ```bash
    # View specific lines with numbers
    nl -ba filename.py | sed -n '10,20p'
    ```
    
    ### Any other command you want to run
    ```bash
    anything
    ```
    
    ## Behavioral Specification
    This is the behavioral specification for the add function in example/NumberUtils.py:
    
    - Single Input possible data types (for left and right arguments to add()):
      - null
      - Empty list
      - List with exactly 1 element
      - List with more than 1 element
    - Combination of Inputs to the add() function:
      - Left operand present, right operand absent
      - Left operand absent, right operand present
      - Both left and right operands present
    - Output Partitions:
      - Result is null
      - Result is an empty list
      - Result is a list with more than 1 element
    - Boundary Analysis (for valid left or right arguments for the add() function):
      - On-point values: 0, 9
      - Off-point values: -1, 10
    
    Boundary analysis on-point values check the conditional statement returns a true statement, and off-point values check that the conditional statement returns a false value. However, we need the tightest tolerance values possible in between on-point and off-point values to make 
    the conditional go from true (on-point) to false (off-point). So we want to test the first value that makes the conditional true (on-point) and the first value that makes the conditional false (off-point) to check this boundary
    from true to false of the conditional. So, for example, a conditional of `x < 10`, the on-point value would be `9` since it's the last value that makes the condition statement true, and `10` would be the off-point value
    because it's the first value that makes the conditional false. We want a test value on both sides of this conditional statement (last value to make it true, and first to make it false) so we can detect when the value of `x`
    causes a behavior change.


environment:
  # Each instance runs in its prebuilt SWE-bench Docker image (see run_swt_bench_complete.py)
  cwd: "/testbed"
  timeout: 300
  interpreter: ["bash", "-c"]
  # No network inside the container, so the agent can't look up the official fix online
  run_args: ["--rm", "--network", "none"]
  env:
    # bash -c doesn't source ~/.bashrc on its own; this makes it activate the image's testbed conda env
    BASH_ENV: /root/.bashrc
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'

run:
  output_path: "last_mini_run.traj.json"
