model:
  model_name: "deepseek/deepseek-flash"
  model_kwargs:
    api_base: "https://api.deepseek.com"
    drop_params: true
  litellm_model_registry: "registry.json"
  cost_tracking: "ignore_errors"

agent:
  system_template: |
    You are a helpful assistant that can interact with a computer.
  instance_template: |
    Please generate test cases that reproduce the bug described in the issue below. Do NOT fix the issue.
    
    You can execute bash commands and edit files to create test files. Your current working directory is the root of
    the repository, checked out at the commit that contains the bug.
    
    ## Issue
    {{task}}
    
    ## Instructions
    1. Analyze the codebase by finding and reading relevant files
    2. Create a script to reproduce the issue
    3. Search the code to find the functions executed by the script from step 2. Create a call graph of the functions used to reproduce the issue. 
    4. Perform input partitions, boundary values, important input combinations, and expected outputs on the functions in the call graph. See the Behavioral Specification section below for an example on how to do this.
    5. Create new tests using this Behavioral Specification. Only create new tests that do not duplicate test conditions performed by existing tests.
    6. Run the test suite to verify the new tests fail (as they should fail to show the issue in the code). For any new test created by you that does not fail, remove it.
    7. If no new tests are generated after step 5: repeat steps 3-5 up to 25 times until a failed test is created or the limit of 25 is reached.
    8. Do NOT modify any non-test source files and do NOT attempt to fix the issue. Only add or edit tests inside the repository's existing test suite (e.g. a `tests/` directory or `test_*.py` files next to existing tests). Delete the reproduction script from step 2 and any other scratch files before submitting.
    9. Leave your new tests in place (do not commit or revert them). They are collected automatically with `git diff` when you submit.
    10. Submit your final output by issuing: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`. Do not combine it with any other command. <important>After this command, you cannot continue working on this task.</important>
    
    ## Useful command examples
    ### Create a new file:
    ```bash
    cat <<'EOF' > newfile.py
    import numpy as np
    hello = "world"
    print(hello)
    EOF
    ```
    
    ### View file content:
    ```bash
    # View specific lines with numbers
    nl -ba filename.py | sed -n '10,20p'
    ```
    
    ### Any other command you want to run
    ```bash
    anything
    ```
    
    ## Behavioral Specification
    for the add function in example/NumberUtils.py:
    
    - Single Input possible data types (for left and right arguments to add()):
      - null
      - Empty list
      - List with exactly 1 element
      - List with more than 1 element
    - Combination of Inputs:
      - Left operand present, right operand absent
      - Left operand absent, right operand present
      - Both left and right operands present
    - Output Partitions:
      - Result is null
      - Result is an empty list
      - Result is a list with more than 1 element
    - Boundary Analysis (for valid left/right inputs):
      - On-point values: 0, 9
      - Off-point values: -1, 10


environment:
  timeout: 300
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'

run:
  output_path: "last_mini_run.traj.json"
